# Use Ctrl + Space as prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix # Split panes

unbind %
# unbind '"'
bind v split-window -h
#bind h split-window -v

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse mode (click to select pane/window, drag to resize)
set -g mouse on

# Use vim-style keys for pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start window/pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Don't rename windows automatically
set-option -g allow-rename off

# Allow copy/paste between tmux and system clipboard
set -s set-clipboard on

# Status bar configuration
set -g status-position bottom
set -g status-justify left

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=green'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

set-option -g status-style bg=default,fg=default
set-window-option -g window-status-style bg=default
