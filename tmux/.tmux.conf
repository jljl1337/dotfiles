# Use Ctrl + Space as prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix # Split panes

unbind %
# unbind '"'
bind v split-window -h
#bind h split-window -v

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse mode (click to select pane/window, drag to resize)
set -g mouse on

# Use vim-style keys for pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start window/pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Don't rename windows automatically
set-option -g allow-rename off
